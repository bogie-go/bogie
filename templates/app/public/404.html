<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 Not Found</title>
<style>
  :root { color-scheme: light dark; --fg: #1c1b19; --muted: #6a675f; --bg: #f8f6f1; }
  @media (prefers-color-scheme: dark) { :root { --fg: #ecebe7; --muted: #9c9a93; --bg: #151514; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { text-align: center; padding: 1.5rem; }
  h1 { font-size: 1.75rem; margin: 0 0 .4rem; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>404 Not Found</h1>
  <p>The page you were looking for doesn&rsquo;t exist.</p>
</main>
</body>
</html>
