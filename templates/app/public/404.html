<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 Not Found</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1c1b19; --muted: #6a675f; --line: #e4e1d8; --bg: #f8f6f1; --panel: #fffdf9;
        --accent: #c0392b; --accent-soft: #fbe9e6; --glow: #bfe8f2;
      }
      @media (prefers-color-scheme: dark) {
        :root { --fg: #ecebe7; --muted: #9c9a93; --line: #2e2d2a; --bg: #151514; --panel: #1d1d1b;
                --accent: #ea6e5f; --accent-soft: #3a2320; --glow: #1f3a42; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
             font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 30rem; margin: 0 auto; padding: 6vh 1.5rem 4vh; text-align: center; }
      figure { margin: 0 0 1.75rem; position: relative; }
      figure::before { content: ""; position: absolute; inset: 8% 10% 18%; border-radius: 50%;
                        background: radial-gradient(closest-side, var(--glow), transparent); z-index: 0; }
      img { position: relative; z-index: 1; display: block; width: 100%; height: auto; border-radius: 1rem;
            filter: drop-shadow(0 16px 24px rgba(0, 0, 0, .18)); }
      .eyebrow { margin: 0; font-size: .78rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
      h1 { font-size: clamp(1.6rem, 5vw, 2.1rem); line-height: 1.15; margin: .4rem 0 .6rem; letter-spacing: -.01em; }
      p.lead { font-size: 1.05rem; color: var(--muted); margin: 0 0 1.75rem; }
      a.home { display: inline-flex; align-items: center; gap: .4rem; padding: .65rem 1.2rem; border-radius: .6rem;
               background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; font-size: .95rem; }
      a.home:hover { opacity: .9; }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <img src="/images/bogie-404.webp" alt="Bogie's mascot, a gopher riding a mine cart, squinting at a treasure map on a cliff edge beside a wooden 404 sign">
      </figure>
      <p class="eyebrow">404</p>
      <h1>Off the map</h1>
      <p class="lead">The page you were looking for doesn&rsquo;t exist.</p>
      <a class="home" href="/">&larr; Back home</a>
    </main>
  </body>
</html>
