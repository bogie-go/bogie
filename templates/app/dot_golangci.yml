# One rule is deliberately off: ST1003, which asks for package names without
# underscores. A Rails namespace is a package here, admin_controller for
# `namespace :admin`, because the layout follows Rails conventions on purpose,
# so moving between this repository and the Rails app costs nothing. It is a
# decision, not an oversight, and everything else staticcheck asks for is
# enforced: if the linter complains about anything else, the complaint is real.
version: "2"

linters:
  default: standard
  enable:
    - staticcheck
  settings:
    staticcheck:
      checks:
        - all
        - -ST1003
  exclusions:
    rules:
      # The store's uuid helpers and test helper exist for the models the
      # generators write, and jobs.go's add for the jobs; an app between
      # models or before its first job would otherwise be told they are
      # unused.
      - path: (app/models/(uuid|store_test)|app/jobs/jobs)\.go
        linters:
          - unused
